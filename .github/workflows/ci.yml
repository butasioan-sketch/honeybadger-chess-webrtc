name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable

      - run: flutter pub get

      - name: Formatierung pruefen
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyzer
        run: flutter analyze

      - name: Tests
        run: flutter test
